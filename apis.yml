aid: greentoe
name: Greentoe
description: Greentoe is a name-your-price e-commerce marketplace where shoppers make an offer on
  brand-new electronics, cameras, TVs and home theater, appliances, baby gear, watches, and optics,
  and manufacturer-authorized retailers compete to fulfill the order at the buyer's price. Built to
  bring the negotiation model of big-ticket purchases online, Greentoe reports more than $100M saved
  by its customers, backs every order with manufacturer warranties and a 30-day return policy, and is
  backed by 500 Global and Y Combinator. Greentoe operates as a consumer-facing web application and
  does not currently publish a public developer API; this profile captures its public web and security
  surface for the API Evangelist network.
